<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DON'T CRASH!</title>
<meta name="description" content="Fly through towers, canyons, bosses and space. Don't crash.">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d14">
<style>
@font-face { font-family: "Highway"; src: url("fonts/Overpass.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
html, body { margin: 0; height: 100%; overflow: hidden; position: fixed; width: 100%; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; }
#gui { position: fixed; inset: 0; overflow: hidden; font-family: "Highway", sans-serif; font-weight: 600; pointer-events: none; -webkit-tap-highlight-color: transparent; }
.gui { position: absolute; box-sizing: border-box; display: flex; pointer-events: none; line-height: 1.12; }
.gui-btn, .gui-scroll, input.gui { pointer-events: auto; cursor: default; }
.gui-btn { cursor: pointer; }
.gui-text { display: block; min-width: 0; font: inherit; line-height: 1.12; padding-top: 0.08em; }
.gui-inner { position: relative; box-sizing: border-box; }
.gui-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.5) transparent; }
.gui-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
.gui-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); }
.gui-scroll::-webkit-scrollbar-track { background: transparent; }
.gui-img { width: 100%; height: 100%; pointer-events: none; }
.gui-vp { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
input.gui { font-family: "Highway", sans-serif; font-weight: 600; border: 0; outline: none; padding: 0 12px; text-align: center; -webkit-user-select: text; user-select: text; }
input.gui::placeholder { color: rgb(150,150,150); opacity: 1; }
#rotate { display: none; position: fixed; inset: 0; z-index: 200; background: #0b0d14; color: #fff; font: 600 26px "Highway", sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 30px; }
#rotate .phone { width: 70px; height: 120px; border: 5px solid #fff; border-radius: 14px; animation: turn 1.8s ease-in-out infinite; }
#rotate small { font-size: 16px; color: #aaa; max-width: 320px; }
@keyframes turn { 0%, 20% { transform: rotate(0deg); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0d14; color: #fff; font: 600 28px "Highway", sans-serif; letter-spacing: 1px; z-index: 100; }
</style>
<script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script>
</head>
<body>
<div id="view"></div>
<div id="gui"></div>
<div id="boot">LOADING...</div>
<div id="rotate"><div class="phone"></div>TURN YOUR PHONE SIDEWAYS<small id="iosHint"></small></div>
<script>
// phones: go fullscreen and lock to landscape on the first touch. iphones can't do that from a website,
// there the tip is to add the game to the home screen
(() => {
	const touch = matchMedia("(pointer: coarse)").matches;
	if (!touch) return;
	// ipads say they're macs these days
	const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
	if (ios && !navigator.standalone) document.getElementById("iosHint").textContent = "TIP: SHARE, THEN ADD TO HOME SCREEN FOR FULLSCREEN";
	const go = (e) => {
		// fullscreen on ios is half broken and fights with the keyboard, and tapping a text field shouldn't do it anywhere
		if (ios || (e && e.target && e.target.tagName === "INPUT")) return;
		const el = document.documentElement;
		if (document.fullscreenElement || !el.requestFullscreen) return;
		el.requestFullscreen({ navigationUI: "hide" }).then(() => {
			if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
		}).catch(() => {});
	};
	addEventListener("pointerdown", go, { passive: true });
	addEventListener("touchend", go, { passive: true });
})();
</script>
<script type="module">
await document.fonts.load('600 20px "Highway"').catch(() => {});
try {
	await import("./js/game.js?v=1790937836");
} catch (e) {
	console.error(e);
	document.getElementById("boot").textContent = "SOMETHING BROKE: " + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
