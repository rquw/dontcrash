<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DON'T CRASH!</title>
<meta name="description" content="Fly through towers, canyons, bosses and space. Don't crash.">
<link rel="icon" href="icon.png">
<style>
@font-face { font-family: "Highway"; src: url("fonts/Overpass.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; }
#gui { position: fixed; inset: 0; overflow: hidden; font-family: "Highway", sans-serif; font-weight: 600; pointer-events: none; -webkit-tap-highlight-color: transparent; }
.gui { position: absolute; box-sizing: border-box; display: flex; pointer-events: none; line-height: 1.12; }
.gui-btn, .gui-scroll, input.gui { pointer-events: auto; cursor: default; }
.gui-btn { cursor: pointer; }
.gui-text { display: block; min-width: 0; font: inherit; line-height: 1.12; padding-top: 0.08em; }
.gui-inner { position: relative; box-sizing: border-box; }
.gui-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.5) transparent; }
.gui-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
.gui-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); }
.gui-scroll::-webkit-scrollbar-track { background: transparent; }
.gui-img { width: 100%; height: 100%; pointer-events: none; }
.gui-vp { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
input.gui { font-family: "Highway", sans-serif; font-weight: 600; border: 0; outline: none; padding: 0 12px; text-align: center; -webkit-user-select: text; user-select: text; }
input.gui::placeholder { color: rgb(150,150,150); opacity: 1; }
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0d14; color: #fff; font: 600 28px "Highway", sans-serif; letter-spacing: 1px; z-index: 100; }
</style>
<script type="importmap">{ "imports": { "three": "./js/three.module.min.js" } }</script>
</head>
<body>
<div id="view"></div>
<div id="gui"></div>
<div id="boot">LOADING...</div>
<script type="module">
await document.fonts.load('600 20px "Highway"').catch(() => {});
try {
	await import("./js/game.js?v=1790679961");
} catch (e) {
	console.error(e);
	document.getElementById("boot").textContent = "SOMETHING BROKE: " + (e && e.message ? e.message : e);
}
</script>
</body>
</html>
